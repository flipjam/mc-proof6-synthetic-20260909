name: Proof6 narrow write-safety closure v1
on:
  workflow_dispatch:
    inputs:
      case:
        description: Fixed campaign case; requires separate approved provisioning and freeze
        required: true
        type: choice
        default: RECOVER
        options:
        - RECOVER
        - D03_REMOTE_REJECTION
        - D07_DROP_PATCH_RESPONSE
        - POSTRECOVERY
permissions:
  contents: read
  actions: read
concurrency:
  group: proof6-ws-closure-v1-writer
  cancel-in-progress: false
jobs:
  writer:
    if: github.repository_id == '1363510385' && github.ref == 'refs/heads/proof6-ws-closure-v1-exec-compat-v1-runtime' && github.workflow_ref == 'flipjam/mc-proof6-synthetic-20260909/.github/workflows/proof6-write-safety-closure-v1.yml@refs/heads/proof6-ws-closure-v1-exec-compat-v1-runtime'
    environment: proof6-ws-closure-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
    - name: Require separately frozen identity before credentials
      shell: bash
      env:
        P6WSV1_MANIFEST: ${{ vars.P6WSV1_EXEC_COMPAT_FROZEN_MANIFEST }}
        P6WSV1_HASH: ${{ vars.P6WSV1_EXEC_COMPAT_MANIFEST_SHA256 }}
      run: |
        set -euo pipefail
        test "$RUNNER_ENVIRONMENT" = github-hosted
        test -n "$P6WSV1_MANIFEST"
        test -n "$P6WSV1_HASH"
        test "$(printf '%s' "$P6WSV1_MANIFEST" | sha256sum | cut -d' ' -f1)" = "$P6WSV1_HASH"
        git init --quiet .
        git remote add origin https://github.com/flipjam/mc-proof6-synthetic-20260909.git
        git fetch --quiet --depth=1 origin "$GITHUB_SHA"
        git checkout --quiet --detach FETCH_HEAD
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
    - name: Create exact installation credential
      id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
      with:
        app-id: '4893415'
        private-key: ${{ secrets.P6WSV1_APP_PRIVATE_KEY }}
        owner: flipjam
        repositories: mc-proof6-synthetic-20260909
        permission-contents: write
        permission-metadata: read
    - name: Execute one fixed request under frozen qualification
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        P6WSV1_D03_JOB_TOKEN: ${{ github.token }}
        P6WSV1_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        P6WSV1_APP_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
        P6WSV1_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        P6WSV1_EXEC_COMPAT_FROZEN_MANIFEST: ${{ vars.P6WSV1_EXEC_COMPAT_FROZEN_MANIFEST }}
        P6WSV1_EXEC_COMPAT_MANIFEST_SHA256: ${{ vars.P6WSV1_EXEC_COMPAT_MANIFEST_SHA256 }}
      run: |
        set -euo pipefail
        /usr/bin/python3 -I -B proofs/proof6/write_safety_closure_v1/launcher.py
