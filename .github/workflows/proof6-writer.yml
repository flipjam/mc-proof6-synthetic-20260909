name: Proof6 one startup diagnostic
on:
  workflow_dispatch:
permissions:
  statuses: write
concurrency:
  group: proof6-r3h-startup-diagnostic-once
  cancel-in-progress: false
jobs:
  signal_setup:
    if: github.repository_id == '1363510385' && github.ref == 'refs/heads/codex/proof6-r3h-s1-startup-diagnostic-20260912-01' && github.workflow_ref == 'flipjam/mc-proof6-synthetic-20260909/.github/workflows/proof6-writer.yml@refs/heads/codex/proof6-r3h-s1-startup-diagnostic-20260912-01'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      statuses: write
    steps:
    - name: Load exact diagnostic commit
      shell: bash
      run: |
        set -euo pipefail
        test "$RUNNER_ENVIRONMENT" = github-hosted
        test "$GITHUB_REF" = refs/heads/codex/proof6-r3h-s1-startup-diagnostic-20260912-01
        git init --quiet .
        git remote add origin https://github.com/flipjam/mc-proof6-synthetic-20260909.git
        git fetch --quiet --depth=1 origin "$GITHUB_SHA"
        git checkout --quiet --detach FETCH_HEAD
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        test -x /usr/bin/unshare
        test -x /usr/bin/timeout
        test -x /usr/bin/python3
        /usr/bin/sudo -n /usr/bin/true
    - name: Reproduce fixed helper startup with bounded diagnostics
      id: d04-signal-start
      shell: bash
      env:
        PROOF6_D04_STATUS_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        printf 'PROOF6_STARTUP_SHELL {"schema":"PROOF6_STARTUP_DIAGNOSTIC_V1","stage":"OUTER_START","utc_epoch":"%s","pid":%s,"euid":%s}\n' "$EPOCHREALTIME" "$$" "$EUID"
        sudo -n --preserve-env=PROOF6_D04_STATUS_TOKEN,GITHUB_REPOSITORY,GITHUB_REPOSITORY_ID,GITHUB_REF,GITHUB_WORKFLOW_REF,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_EVENT_NAME /bin/bash <<'FIXED_HELPER_SUPERVISOR'
        set -euo pipefail
        stage=ROOT_PATH
        diagnostic_exit() {
          code=$?
          printf 'PROOF6_STARTUP_SHELL {"schema":"PROOF6_STARTUP_DIAGNOSTIC_V1","stage":"%s","utc_epoch":"%s","pid":%s,"euid":%s,"exit_code":%s}\n' "$stage" "$EPOCHREALTIME" "$$" "$EUID" "$code"
        }
        trap diagnostic_exit EXIT
        root="/tmp/proof6-d04-signal-${GITHUB_RUN_ID}-1-${GITHUB_SHA}"
        test ! -e "$root"
        stage=ROOT_CREATE
        mkdir -m 700 "$root"
        stage=ROOT_CREATED
        printf 'PROOF6_STARTUP_SHELL {"schema":"PROOF6_STARTUP_DIAGNOSTIC_V1","stage":"ROOT_CREATED","utc_epoch":"%s","pid":%s,"euid":%s,"socket_path_bytes":%s}\n' "$EPOCHREALTIME" "$$" "$EUID" "$((${#root}+12))"
        (
          set +e
          trap - EXIT
          /usr/bin/timeout --signal=KILL 120s /usr/bin/python3 -I -B proofs/proof6/d04_signal.py serve-setup &
          native=$!
          printf '%s\n' "$native" > "$root/native.pid"
          printf 'PROOF6_STARTUP_SHELL {"schema":"PROOF6_STARTUP_DIAGNOSTIC_V1","stage":"NATIVE_STARTED","utc_epoch":"%s","pid":%s,"euid":%s,"native_pid":%s}\n' "$EPOCHREALTIME" "$BASHPID" "$EUID" "$native"
          wait "$native"
          result=$?
          printf 'PROOF6_STARTUP_SHELL {"schema":"PROOF6_STARTUP_DIAGNOSTIC_V1","stage":"NATIVE_REAPED","utc_epoch":"%s","pid":%s,"euid":%s,"exit_code":%s}\n' "$EPOCHREALTIME" "$BASHPID" "$EUID" "$result"
          printf '%s\n' "$result" > "$root/reaped.exit"
        ) </dev/null >"$root/helper.log" 2>&1 &
        stage=IPC_READY_WAIT
        for ((i=0; i<100; i++)); do
          if test -f "$root/reaped.exit"; then stage=HELPER_EXIT_BEFORE_READY; exit 1; fi
          if test -f "$root/started.json"; then stage=IPC_READY; exit 0; fi
          sleep 0.1
        done
        stage=IPC_READY_TIMEOUT
        exit 1
        FIXED_HELPER_SUPERVISOR
    - name: Qualify credential-free setup peer and reap it
      shell: bash
      run: |
        set -euo pipefail
        sudo -n --preserve-env=GITHUB_REPOSITORY,GITHUB_REPOSITORY_ID,GITHUB_REF,GITHUB_WORKFLOW_REF,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_EVENT_NAME /usr/bin/timeout --signal=KILL 20s /usr/bin/python3 -I -B proofs/proof6/d04_signal.py qualify-setup </dev/null
    - name: Require setup helper completion and both processes reaped
      id: qualified
      if: always()
      shell: bash
      run: |
        set +e
        sudo -n --preserve-env=GITHUB_REPOSITORY,GITHUB_REPOSITORY_ID,GITHUB_REF,GITHUB_WORKFLOW_REF,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_EVENT_NAME /usr/bin/python3 -I -B proofs/proof6/d04_signal.py cleanup-setup
        result=$?
        sudo -n --preserve-env=GITHUB_RUN_ID,GITHUB_SHA /usr/bin/python3 -I -B proofs/proof6/d04_startup_diagnostic.py
        replay=$?
        if test "$replay" -ne 0; then result=1; fi
        printf 'DIAGNOSTIC_RESULT {"schema":"PROOF6_STARTUP_DIAGNOSTIC_V1","cleanup_exit":%s,"acceptance_credit":false,"status_posts":0}\n' "$result"
        exit "$result"
